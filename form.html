<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review - WDD131</title>
    <meta name="description" content="Little activity for the WDD131 course focused in form handling.">
    <meta name="author" content="Eli Avila">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html" class="wf2">

            <fieldset>
                <legend>Product Name</legend>
                <label for="product">Product Name</label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                    <!-- Remaining options are added dynamically by scripts/form.js -->
                </select>
            </fieldset>

            <fieldset>
                <legend>Overall Rating</legend>
                <div class="rating">
                    <label for="rating1">&starf;<span class="visually-hidden">1 star</span></label>
                    <input type="radio" id="rating1" name="rating" value="1" required>

                    <label for="rating2">&starf;&starf;<span class="visually-hidden">2 stars</span></label>
                    <input type="radio" id="rating2" name="rating" value="2" required>

                    <label for="rating3">&starf;&starf;&starf;<span class="visually-hidden">3 stars</span></label>
                    <input type="radio" id="rating3" name="rating" value="3" required>

                    <label for="rating4">&starf;&starf;&starf;&starf;<span class="visually-hidden">4 stars</span></label>
                    <input type="radio" id="rating4" name="rating" value="4" required>

                    <label for="rating5">&starf;&starf;&starf;&starf;&starf;<span class="visually-hidden">5 stars</span></label>
                    <input type="radio" id="rating5" name="rating" value="5" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Date of Installation</legend>
                <label for="installation-date">Date of Installation</label>
                <input type="date" id="installation-date" name="installation-date" required>
            </fieldset>

            <fieldset>
                <legend>Which features did you find useful in the product?</legend>
                <div>(Check all that apply)</div>

                <label for="feature1"><input type="checkbox" id="feature1" name="features" value="durability"> Durability</label>
                <label for="feature2"><input type="checkbox" id="feature2" name="features" value="ease-of-use"> Ease of Use</label>
                <label for="feature3"><input type="checkbox" id="feature3" name="features" value="performance"> Performance</label>
                <label for="feature4"><input type="checkbox" id="feature4" name="features" value="design"> Design</label>
            </fieldset>

            <fieldset>
                <legend>Written Review <span class="optional">(Optional)</span></legend>
                <label for="review" class="visually-hidden">Written Review</label>
                <textarea id="review" name="review" rows="5" cols="50" placeholder="Share your thoughts about the product..."></textarea>
            </fieldset>

            <fieldset>
                <legend>Your Name <span class="optional">(Optional)</span></legend>
                <label for="name" class="visually-hidden">Your Name</label>
                <input type="text" id="name" name="name">
            </fieldset>

            <input type="submit" value="Post Review">

        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Eli Avila &middot; WDD131 Website Planning Document</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
